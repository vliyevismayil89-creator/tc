<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>TC</title><meta name="title" content="TC"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#050b0f">

    <title>Toğrul Cəfərov</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">




<div class="page">

    <!-- LANGUAGE -->

    <button id="languageToggle" class="language-toggle" type="button">
        <span class="lang-az active">AZ</span>
        <span class="lang-separator">/</span>
        <span class="lang-en">EN</span>
    </button>


    <!-- CARD -->

    <main class="card-scene">

        <div id="guideCard" class="guide-card">


            <!-- =========================
                 FRONT
            ========================== -->

            <section class="card-face card-front">

                <div class="mountain-bg"></div>
                <div class="dark-overlay"></div>
                <div class="vignette"></div>
                <div class="grain"></div>


                <header class="front-header">

                    <div class="country-mark">

                        <div class="hiker-logo">
                            <i class="fa-solid fa-person-hiking"></i>
                        </div>

                        <div class="country-text">

                            <strong data-az="AZƏRBAYCAN" data-en="AZERBAIJAN">
                                AZƏRBAYCAN
                            </strong>

                        </div>

                    </div>


                    <div class="nfc-symbol">

                        <i class="fa-solid fa-wifi"></i>

                        <span>NFC</span>

                    </div>

                </header>


                <div class="front-content">

                    <!-- COMPASS -->

                    <div class="compass-wrap">

                        <div class="compass-ring ring-outer"></div>

                        <div class="compass-ring ring-middle"></div>


                        <div class="compass">

                            <span class="direction north">N</span>
                            <span class="direction east">E</span>
                            <span class="direction south">S</span>
                            <span class="direction west">W</span>


                            <div class="needle">

                                <span class="needle-top"></span>
                                <span class="needle-bottom"></span>

                            </div>


                            <div class="compass-center">

                                <i class="fa-solid fa-mountain"></i>

                            </div>

                        </div>


                        <div class="compass-glow"></div>

                    </div>


                    <!-- IDENTITY -->

                    <div class="identity">

                        <div class="profession">

                            <span data-az="DAĞ BƏLƏDÇİSİ" data-en="MOUNTAIN GUIDE">
                                DAĞ BƏLƏDÇİSİ
                            </span>

                        </div>


                        <h1>

                            <span data-az="Toğrul Cəfərov" data-en="Togrul Jafarov">
                                Toğrul Cəfərov
                            </span>

                        </h1>


                        <div class="identity-line">

                            <span></span>

                            <i class="fa-solid fa-compass"></i>

                            <span></span>

                        </div>

                    </div>

                </div>


                <!-- CONTACT BUTTON -->

                <button id="openContacts" class="contact-button" type="button">

                    <span data-az="ƏLAQƏLƏR" data-en="CONTACT">
                        ƏLAQƏLƏR
                    </span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </section>



            <!-- =========================
                 BACK
            ========================== -->

            <section class="card-face card-back">

                <div class="back-background"></div>

                <div class="back-overlay"></div>

                <div class="grain"></div>


                <!-- BACK HEADER -->

                <header class="back-header">

                    <button id="backButton" class="back-button" type="button">

                        <i class="fa-solid fa-arrow-left"></i>

                    </button>


                    <div class="back-title-small">

                        <span data-az="ƏLAQƏ" data-en="CONTACT">
                            ƏLAQƏ
                        </span>

                    </div>


                    <div class="back-nfc">

                        <i class="fa-solid fa-wifi"></i>

                    </div>

                </header>



                <!-- BACK TITLE -->

                <div class="back-title">

                    <div class="title-kicker">

                        <span data-az="ƏLAQƏ SAXLA" data-en="GET IN TOUCH">
                            ƏLAQƏ SAXLA
                        </span>

                    </div>


                    <h2>

                        <span data-az="Dağ macəranı başlat" data-en="Start your mountain adventure">
                            Dağ macəranı başlat
                        </span>

                    </h2>


                    <p>

                        <span data-az="Səyahətini növbəti zirvəyə apar." data-en="Take your journey to the next summit.">
                            Səyahətini növbəti zirvəyə apar.
                        </span>

                    </p>

                </div>



                <!-- CONTACTS -->

                <div class="contact-list">


                    <!-- WHATSAPP -->

                    <a class="contact-card whatsapp" href="https://wa.me/994505909535" aria-label="WhatsApp">

                        <div class="contact-icon">

                            <i class="fa-brands fa-whatsapp"></i>

                        </div>


                        <div class="contact-text">

                            <span>WhatsApp</span>

                            <small data-az="Birbaşa əlaqə" data-en="Direct contact">
                                Birbaşa əlaqə
                            </small>

                        </div>


                        <i class="fa-solid fa-arrow-up-right-from-square contact-arrow"></i>

                    </a>



                    <!-- INSTAGRAM -->

                    <a class="contact-card instagram" href="https://www.instagram.com/ecotour.az/" aria-label="Instagram">

                        <div class="contact-icon">

                            <i class="fa-brands fa-instagram"></i>

                        </div>


                        <div class="contact-text">

                            <span>Instagram</span>

                            <small data-az="Səyahətlər və dağlar" data-en="Journeys &amp; mountains">
                                Səyahətlər və dağlar
                            </small>

                        </div>


                        <i class="fa-solid fa-arrow-up-right-from-square contact-arrow"></i>

                    </a>



                    <!-- WIKILOC -->

                    <a class="contact-card wikiloc" href="https://loc.wiki/u/9956760?wa=uc" aria-label="Wikiloc">

                        <div class="contact-icon">

                            <i class="fa-solid fa-route"></i>

                        </div>


                        <div class="contact-text">

                            <span>Wikiloc</span>

                            <small data-az="Marşrutlar" data-en="Routes">
                                Marşrutlar
                            </small>

                        </div>


                        <i class="fa-solid fa-arrow-up-right-from-square contact-arrow"></i>

                    </a>

                </div>



                <!-- NFC -->

                <div class="nfc-panel">

                    <div class="nfc-animation">

                        <i class="fa-solid fa-wifi"></i>

                    </div>


                    <div>

                        <strong>NFC</strong>

                        <span data-az="Telefonu yaxınlaşdır" data-en="Tap your phone">
                            Telefonu yaxınlaşdır
                        </span>

                    </div>

                </div>



                <!-- FOOTER -->

                <div class="back-footer">

                    <span data-az="Zirvədə görüşərik" data-en="See you at the summit">
                        Zirvədə görüşərik
                    </span>

                    <div class="footer-line"></div>

                </div>

            </section>

        </div>

    </main>

</div>


<script src="script.js"></script>


<script src="./script.js"></script></body></html>
